default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("PGHOST", "127.0.0.1") %>
  port: <%= ENV.fetch("PGPORT", "55432") %>
  username: <%= ENV.fetch("PGUSER", "leadcurrent") %>
  password: <%= ENV["PGPASSWORD"] %>
development:
  <<: *default
  database: leadcurrent_development
test:
  <<: *default
  database: leadcurrent_test
production:
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  url: <%= ENV["DATABASE_URL"] %>
